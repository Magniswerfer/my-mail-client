name: Build

# Compiles both apps and runs the engine's unit tests on every push. Integration tests skip
# themselves here (no local Dovecot/Mailpit), and nothing touches a real mail account.
#
# One job on one runner, steps in sequence: macOS runners are often short, and three parallel
# jobs could each wait for (or never get) a machine.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine and the push server on Linux, as Coolify runs them (ADR 0007). Integration and
  # end-to-end tests skip here (no Dovecot/Mailpit).
  linux:
    name: Engine and push server on Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - run: swift build --package-path MailEngine
      - run: swift test --package-path MailEngine
      - name: Push server
        run: swift test --package-path PushServer

  # SPEC §15: the budgets are requirements. A 250k-message synthetic mailbox, measured in a
  # release build; fails over budget, or >10% slower than the last passing run on main on the
  # same CPU model (see docs/performance.md). Its own runner, so it doesn't hold up the tests.
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Build (release)
        run: swift build -c release --package-path MailEngine --product tidings-bench
      - name: Baseline from main
        uses: actions/cache/restore@v4
        with:
          path: perf-baseline.json
          # Never an exact hit: the prefix picks the newest baseline main saved.
          key: perf-baseline-${{ github.sha }}
          restore-keys: perf-baseline-
      - name: Seed the synthetic mailbox
        run: MailEngine/.build/release/tidings-bench seed --count 250000 --dir "$RUNNER_TEMP/bench"
      - name: Measure and check
        run: |
          bench=MailEngine/.build/release/tidings-bench
          $bench run --dir "$RUNNER_TEMP/bench" --out perf.json
          # Budgets fail the job; a slowdown against main's last run only warns, since two shared
          # VMs with the same CPU can differ by more than the tolerance. A shared runner can have
          # a bad minute: measure once more before failing.
          if ! $bench compare --current perf.json --baseline perf-baseline.json --warn-on-regression > /dev/null; then
            echo "::warning::A budget check failed; measuring again before deciding."
            $bench run --dir "$RUNNER_TEMP/bench" --out perf.json
          fi
          $bench compare --current perf.json --baseline perf-baseline.json --warn-on-regression --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf.json
          if-no-files-found: ignore
      - name: Keep as main's baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cp perf.json perf-baseline.json
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.sha }}

  build:
    name: Engine tests, Mac app, iPhone app
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPS_WITHOUT_ICON: EXCLUDED_SOURCE_FILE_NAMES=AppIcon.icon ASSETCATALOG_COMPILER_APPICON_NAME=
    steps:
      - uses: actions/checkout@v5
      # The newest Xcode on the image (and the list, to see when Xcode 27 arrives).
      - name: Newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version && swift --version

      - name: Engine tests
        id: engine
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --package-path MailEngine 2>&1 | tee test.log

      # The app icon is an Icon Composer file from Xcode 27; the Xcode 26 actool on these runners
      # crashes on it. CI builds the apps without it (APPS_WITHOUT_ICON) until runners have 27.
      - name: Mac app
        id: mac
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project App/Tidings.xcodeproj -scheme Tidings -destination "platform=macOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO $APPS_WITHOUT_ICON 2>&1 | tee mac.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" mac.log

      - name: iPhone app
        id: iphone
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project App/Tidings.xcodeproj -scheme TidingsMobile -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO $APPS_WITHOUT_ICON 2>&1 | tee ios.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ios.log

      - name: Report
        if: always()
        run: |
          # One annotation per failing part, carrying every distinct error, so it shows on the commit's checks.
          annotate() {
            local title="$1" errors="$2"
            printf '::error title=%s::%s\n' "$title" "$(printf '%s' "$errors" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          }
          failed=0
          if [ "${{ steps.engine.outcome }}" != "success" ]; then
            annotate "Engine test failures" "$(grep -E "error:|✘|recorded an issue" test.log | sed -E 's#^.*/MailEngine/#MailEngine/#' | sort -u | head -80)"; failed=1
          fi
          if [ "${{ steps.mac.outcome }}" != "success" ]; then
            annotate "Tidings build errors" "$(grep -E "error:" mac.log | sed -E 's#^.*/(App|MailEngine)/#\1/#' | sort -u | head -80)"; failed=1
          fi
          if [ "${{ steps.iphone.outcome }}" != "success" ]; then
            annotate "TidingsMobile build errors" "$(grep -E "error:" ios.log | sed -E 's#^.*/(App|MailEngine)/#\1/#' | sort -u | head -80)"; failed=1
          fi
          echo "engine=${{ steps.engine.outcome }} mac=${{ steps.mac.outcome }} iphone=${{ steps.iphone.outcome }}"
          exit $failed
