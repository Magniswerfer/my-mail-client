# A second Dovecot shaped like NordicWay's: every folder under INBOX., and both Sent and
# "Sent Messages" marked \Sent (NamespaceTests; TIDINGS_NAMESPACE_PORT=31145).
namespace inbox {
  prefix = INBOX.
  separator = .
  mailbox Sent {
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
  # No SPECIAL-USE flag: found by its name under INBOX.
  mailbox Trash {
    auto = create
  }
}
