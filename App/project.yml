name: Tidings
options:
  bundleIdPrefix: hk.gnus
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.4"
    CURRENT_PROJECT_VERSION: "10"
    PRODUCT_DISPLAY_NAME: Tidings
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # Creative Oak ApS owns the iCloud container (ADR 0006).
    DEVELOPMENT_TEAM: 493257NQK3
    # iCloud.hk.gnus.tidings for the apps; the dev copy (hk.gnus.tidings.dev) gets its own.
    TIDINGS_CLOUD_CONTAINER: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
packages:
  MailEngine:
    path: ../MailEngine
  # Mac updates (SPEC §17): signed, notarized releases from GitHub Releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
targets:
  # Mac app. Shared code lives in Tidings/; Mac-only code in Tidings/Mac and behind #if os(macOS).
  Tidings:
    type: application
    platform: macOS
    sources:
      - path: Tidings
        excludes:
          - "iOS/**"
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      # The Icon Composer file (Liquid Glass layers), compiled into the app icon.
      - path: Tidings/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MailEngine
        product: MailEngine
      - package: Sparkle
        product: Sparkle
    info:
      path: Tidings/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        # From MARKETING_VERSION / CURRENT_PROJECT_VERSION (Sparkle compares the build number).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, da]
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: AGPL-3.0
        NSCalendarsFullAccessUsageDescription: Tidings adds invitations you accept to your calendar, keeps them up to date when they change, and warns you about clashes.
        NSRemindersFullAccessUsageDescription: Tidings adds reminders for emails you choose, with a link back to the message.
        CFBundleURLTypes:
          - CFBundleURLName: hk.gnus.tidings.message
            CFBundleURLSchemes: [tidings]
        TidingsCloudContainer: $(TIDINGS_CLOUD_CONTAINER)
        # Sparkle: the feed is the appcast attached to the latest GitHub release.
        SUFeedURL: https://github.com/Magniswerfer/tidings-mail/releases/latest/download/appcast.xml
        SUPublicEDKey: YULVASj55kDhVacQo0JotSL0E1ciHFkLcg6oxOGcFe0=
        # Sandboxed: Sparkle installs through its own XPC launcher.
        SUEnableInstallerLauncherService: true
    entitlements:
      path: Tidings/Tidings.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Sparkle's installer launcher and its status channel (sandboxed apps).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [$(TIDINGS_CLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.gnus.tidings
        PRODUCT_NAME: Tidings
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        # Apple silicon only: the classifier stores embeddings as Float16, which Intel Macs lack.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      commandLineArguments:
        "-TidingsDevServer": false

  # iPhone and iPad app: the same model and views, with Tidings/iOS for navigation and life cycle.
  # Set your team under Signing & Capabilities before running on a device. In the Simulator,
  # tick -TidingsDevServer in the scheme to use the local Dovecot/Mailpit (see CLAUDE.md).
  TidingsMobile:
    type: application
    platform: iOS
    sources:
      - path: Tidings
        excludes:
          - "Mac/**"
          - "Info.plist"
          - "Tidings.entitlements"
          - "iOS/TidingsMobile.entitlements"
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      - path: Tidings/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MailEngine
        product: MailEngine
    info:
      path: Tidings/iOS/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        # From MARKETING_VERSION / CURRENT_PROJECT_VERSION (Sparkle compares the build number).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, da]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          # CloudKit's silent pushes when another device changes synced state.
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - hk.gnus.tidings.refresh
        NSCalendarsFullAccessUsageDescription: Tidings adds invitations you accept to your calendar, keeps them up to date when they change, and warns you about clashes.
        NSRemindersFullAccessUsageDescription: Tidings adds reminders for emails you choose, with a link back to the message.
        CFBundleURLTypes:
          - CFBundleURLName: hk.gnus.tidings.message
            CFBundleURLSchemes: [tidings]
        # Remote images in mail are often plain http; this applies to the message view only.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
        # "Add to Things" only shows when Things is installed.
        LSApplicationQueriesSchemes: [things]
        TidingsCloudContainer: $(TIDINGS_CLOUD_CONTAINER)
    entitlements:
      path: Tidings/iOS/TidingsMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [$(TIDINGS_CLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.gnus.tidings
        PRODUCT_NAME: Tidings
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      commandLineArguments:
        "-TidingsDevServer": false
